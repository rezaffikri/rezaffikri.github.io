      h1 { margin: 0 0 16px; color: #fff; font-size: clamp(28px, 6vw, 36px); }
      p { line-height: 1.65; }
      a { display: inline-flex; align-items: center; min-height: 44px; margin-top: 16px; padding: 10px 18px; color: #fff; background: #2a475e; text-decoration: none; }
      a:hover { background: #355f78; }
      a:focus-visible { outline: 2px solid #66c0f4; outline-offset: 4px; }
    </style>
  </head>
